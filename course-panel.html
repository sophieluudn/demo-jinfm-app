<section id="course-panel" aria-label="課程內容" hidden>
  <div class="course-nav"><button id="course-back" aria-label="返回課程列表"><i class="ph ph-caret-left" aria-hidden="true"></i></button><span id="course-nav-title"></span><div><button id="course-favorite" aria-label="收藏課程" aria-pressed="false"><i class="ph ph-heart" aria-hidden="true"></i></button><button id="course-share" aria-label="分享課程"><i class="ph ph-export" aria-hidden="true"></i></button></div></div>
  <div id="course-scroll" tabindex="-1">
    <img id="course-cover" alt="課程封面">
    <div class="course-overview"><h1><span id="course-type" class="tag">聲音</span><span id="course-title"></span></h1><p id="course-subtitle"></p><p id="course-borrow-availability" hidden><span id="course-borrow-count"></span><span class="borrow-total"> / ? 100</span></p><div class="course-price-label">購買價</div><p class="course-price"><span id="course-price"></span><del id="course-old-price"></del></p></div>
    <div class="course-sticky"><div class="course-tabs" role="tablist" aria-label="課程資訊"><button id="course-intro-tab" role="tab" aria-selected="false" aria-controls="course-intro">簡介</button><button id="course-catalog-tab" role="tab" aria-selected="true" aria-controls="course-catalog">目錄</button></div><div id="course-catalog-tools"><div class="catalog-actions"><label class="episode-range"><span class="sr-only">集數範圍</span><select id="episode-range"><option value="first">1–20</option><option value="last">21–24</option></select><i class="ph ph-caret-down" aria-hidden="true"></i></label><button id="episode-sort" aria-label="倒序排列目錄" aria-pressed="false"><i class="ph ph-arrows-down-up" aria-hidden="true"></i></button><div class="catalog-download"><button id="course-delete-downloads" disabled>刪除全部</button><button id="course-download-all">下載本頁音頻</button></div></div><p id="course-download-size">237 MB</p></div></div>
    <div id="course-catalog" role="tabpanel" aria-labelledby="course-catalog-tab"></div>
    <div id="course-intro" role="tabpanel" aria-labelledby="course-intro-tab" hidden></div>
  </div>
  <div class="course-bottom"><button id="course-trial"><i class="ph ph-play" aria-hidden="true"></i><span>試閱</span></button><button id="course-gift"><i class="ph ph-gift" aria-hidden="true"></i><span>贈送朋友</span></button><button id="course-borrow" hidden></button><button id="course-buy">購買</button></div>
</section>
