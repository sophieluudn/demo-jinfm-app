<div id="member-credentials-overlay" hidden>
  <section class="member-credentials-sheet" role="dialog" aria-modal="true" aria-labelledby="credentials-title">
    <div class="credentials-header"><button id="credentials-close" aria-label="關閉 Email／手機登入"><i class="ph ph-x" aria-hidden="true"></i></button></div>
    <div class="credentials-ad" aria-hidden="true"><span class="credentials-ad-question">你能成功當選市長嗎？</span><span class="credentials-ad-caption">立即挑戰</span></div>
    <div class="credentials-tabs" role="tablist" aria-label="登入或註冊">
      <button id="credentials-login-tab" role="tab" aria-selected="true" aria-controls="credentials-login-panel" data-credentials-tab="login">登入</button>
      <button id="credentials-register-tab" role="tab" aria-selected="false" aria-controls="credentials-register-panel" data-credentials-tab="register" tabindex="-1">註冊</button>
    </div>
    <div class="credentials-card">
      <h1 id="credentials-title">E-mail / 手機登入</h1>
      <form id="credentials-login-panel" role="tabpanel" aria-labelledby="credentials-login-tab" novalidate>
        <label class="credentials-field"><span class="sr-only">電子信箱或台灣手機號碼</span><input type="text" name="login-id" placeholder="電子信箱或台灣手機號碼" autocomplete="username"></label>
        <label class="credentials-field credentials-password"><span class="sr-only">密碼</span><input type="password" name="login-password" placeholder="密碼" autocomplete="current-password"><button type="button" class="credentials-password-toggle" aria-label="顯示密碼" aria-pressed="false"><i class="ph-fill ph-eye-slash" aria-hidden="true"></i></button></label>
        <div class="credentials-help"><button type="button" data-credentials-help="忘記密碼">忘記密碼</button><button type="button" data-credentials-help="重寄啟用信">重寄啟用信</button></div>
        <button type="submit" class="credentials-submit">登入</button>
      </form>
      <form id="credentials-register-panel" role="tabpanel" aria-labelledby="credentials-register-tab" novalidate hidden>
        <label class="credentials-field"><span class="sr-only">電子信箱或台灣手機號碼</span><input type="text" name="register-id" placeholder="電子信箱或台灣手機號碼" autocomplete="username"></label>
        <label class="credentials-field credentials-password"><span class="sr-only">密碼</span><input type="password" name="register-password" placeholder="密碼" autocomplete="new-password"><button type="button" class="credentials-password-toggle" aria-label="顯示密碼" aria-pressed="false"><i class="ph-fill ph-eye-slash" aria-hidden="true"></i></button></label>
        <label class="credentials-field"><span class="sr-only">帳號，未填將自動產生</span><input type="text" name="register-account" placeholder="帳號 (未填將自動產生)" autocomplete="nickname"></label>
        <button type="submit" class="credentials-submit register-submit">確認註冊</button>
        <label class="credentials-agreement"><input type="checkbox" checked><span>加入代表您同意 <a href="https://www.udngroup.com/members/service" target="_blank" rel="noopener noreferrer">會員服務條款</a> 與 <a href="https://www.udngroup.com/articles/8ebf4b91-b45c-4e0e-86f1-135ddc9a4b3d" target="_blank" rel="noopener noreferrer">隱私權聲明</a>，並願意訂閱 udn.com 發出的市場相關訊息</span></label>
      </form>
    </div>
  </section>
</div>
