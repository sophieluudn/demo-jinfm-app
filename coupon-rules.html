<div id="coupon-rules-overlay" hidden>
  <section class="coupon-rules-dialog" role="dialog" aria-modal="true" aria-labelledby="coupon-rules-title" aria-describedby="coupon-rules-content">
    <button id="coupon-rules-close" aria-label="關閉紅包折抵規則說明"><i class="ph ph-x" aria-hidden="true"></i></button>
    <h2 id="coupon-rules-title">紅包折抵規則說明</h2>
    <div id="coupon-rules-content">
      <p>活動或儲值贈送之紅包，可用於內容兌換的點數折抵；部分標示不適用的內容，恕無法使用紅包抵用。</p>
      <h3>折價券：</h3>
      <p>兌換內容時，可抵用部分點數，若產生抵用餘額將不返還。每次兌換限抵用一張。</p>
      <h3>禮品券：</h3>
      <p>購買禮品券（贈送朋友）可透過訊息提供收禮人兌換指定內容，收禮人不需支付額外費用。</p>
    </div>
  </section>
</div>
